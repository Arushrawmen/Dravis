    <script>
      // Early error shield for benign Vite dev server WebSocket disconnects in iframe sandboxes
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (
            first.indexOf('[vite] failed to connect to websocket') !== -1 ||
            first.indexOf('WebSocket closed without opened') !== -1 ||
            first.indexOf('WebSocket connection to') !== -1
          )) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (
            first.indexOf('[vite]') !== -1 && first.indexOf('websocket') !== -1
          )) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (typeof reason === 'string' && (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('websocket') !== -1 ||
            reason.indexOf('ws:') !== -1 ||
            reason.indexOf('wss:') !== -1
          )) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || '');
          if (typeof msg === 'string' && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('ws:') !== -1 ||
            msg.indexOf('wss:') !== -1
          )) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
