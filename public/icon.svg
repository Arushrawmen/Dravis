<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="dravisBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <linearGradient id="shardCyanSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="shardCyanViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="shardDeepViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="shardSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="starBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#dravisBg)" />
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" filter="url(#starBloom)" opacity="0.85" />

  <g filter="url(#softGlow)">
    <path d="M 256 60 Q 256 195 390 256 Q 256 256 256 60 Z" fill="url(#shardCyanViolet)" opacity="0.95" />
    <path d="M 256 452 Q 256 317 122 256 Q 256 256 256 452 Z" fill="url(#shardDeepViolet)" opacity="0.92" />
    <path d="M 256 60 Q 256 195 122 256 Q 256 256 256 60 Z" fill="url(#shardCyanSky)" opacity="0.95" />
    <path d="M 256 452 Q 256 317 390 256 Q 256 256 256 452 Z" fill="url(#shardCyanViolet)" opacity="0.9" />

    <polygon points="256,60 286,215 256,256 226,215" fill="url(#shardCyanSky)" opacity="0.85" />
    <polygon points="256,452 286,297 256,256 226,297" fill="url(#shardDeepViolet)" opacity="0.85" />
    <polygon points="452,256 297,226 256,256 297,286" fill="url(#shardCyanViolet)" opacity="0.9" />
    <polygon points="60,256 215,226 256,256 215,286" fill="url(#shardCyanSky)" opacity="0.9" />

    <polygon points="256,190 322,256 256,322 190,256" fill="url(#shardSpecular)" opacity="0.75" />
    <path d="M 256 100 Q 256 220 372 256" stroke="url(#shardSpecular)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>

  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#softGlow)" />
</svg>
